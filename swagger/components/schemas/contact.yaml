type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - isFavourite
  - contactType
  - userId
  - photo
  - createdAt
  - updatedAt
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: John
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+48216566235'
  email:
    description: "Contact's email"
    type: string
    example: johndoe@gmail.com
  isFavourite:
    description: 'Is contact in favourites'
    type: boolean
    example: false
  contactType:
    description: "Contact's type"
    type: string
    enum: ['home', 'work', 'personal']
  userId:
    description: "Contact's user id"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
  createdAt:
    description: 'Date of create the contact'
    type: string
    example: 2025-07-12T08:58:49.097Z
  updatedAt:
    description: 'Date of update the contact'
    type: string
    example: 2025-07-12T08:58:49.097Z
