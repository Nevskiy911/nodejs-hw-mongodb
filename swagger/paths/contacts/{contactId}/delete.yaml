tags:
  - Contacts
summary: Delete contact
operationId: deleteContact
description: 'Delete contact'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    description: Contact's Id to delete
responses:
  '204':
    description: 'Contact successfully deleted'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: Contact not found
