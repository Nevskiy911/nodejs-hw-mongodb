tags:
  - Contacts
summary: Get contacts
operationId: getContacts
description: 'Get your all contacts'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: number
      example: 1
  - in: query
    name: perPage
    schema:
      type: number
      example: 5
  - in: query
    name: isFavourite
    schema:
      type: boolean
      example: true
  - in: query
    name: contactType
    schema:
      type: string
      enum: ['home', 'work', 'personal']
      example: work
  - in: query
    name: sortBy
    schema:
      type: string
      enum: [name, phoneNumber, contactType]
      example: name
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
      example: asc

responses:
  '200':
    description: 'Get all your contacts'
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: number
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - contacts
                - page
                - perPage
                - totalItems
                - totalPages
                - hasPreviousPage
                - hasNextPage
              properties:
                contacts:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                page:
                  type: number
                perPage:
                  type: number
                totalItems:
                  type: number
                totalPages:
                  type: number
                hasPreviousPage:
                  type: boolean
                hasNextPage:
                  type: boolean
  '401':
    $ref: '../../components/responses/401.yaml'
